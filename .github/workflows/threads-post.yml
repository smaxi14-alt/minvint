name: Threads Auto Post

on:
  schedule:
    - cron: '30 22 * * *'  # 07:30 KST (UTC+9)
    - cron: '30 3 * * *'   # 12:30 KST
    - cron: '0 12 * * *'   # 21:00 KST
  workflow_dispatch:
    inputs:
      slot:
        description: '수동 발행 슬롯'
        required: true
        default: 'morning'
        type: choice
        options: [morning, noon, evening]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  post:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # 로그 커밋용
      issues: write    # 실패 알림용

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Determine slot
        id: slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "slot=${{ inputs.slot }}" >> $GITHUB_OUTPUT
          else
            HOUR=$(TZ=Asia/Seoul date +%H)
            echo "KST hour: $HOUR"
            if [ "$HOUR" -ge 7 ] && [ "$HOUR" -lt 11 ]; then
              echo "slot=morning" >> $GITHUB_OUTPUT
            elif [ "$HOUR" -ge 12 ] && [ "$HOUR" -lt 17 ]; then
              echo "slot=noon" >> $GITHUB_OUTPUT
            else
              echo "slot=evening" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Refresh diversity override
        env:
          START_DATE: ${{ vars.START_DATE }}
          PYTHONIOENCODING: utf-8
        run: |
          cd automation
          python diversity_monitor.py 2>/dev/null || true

      - name: Generate and post
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          BUFFER_ACCESS_TOKEN: ${{ secrets.BUFFER_ACCESS_TOKEN }}
          BUFFER_CHANNEL_ID: ${{ secrets.BUFFER_CHANNEL_ID }}
          NAVER_CLIENT_ID: ${{ secrets.NAVER_CLIENT_ID }}
          NAVER_CLIENT_SECRET: ${{ secrets.NAVER_CLIENT_SECRET }}
          START_DATE: ${{ vars.START_DATE }}
          YOUTUBE_CHANNELS_PRIMARY: ${{ vars.YOUTUBE_CHANNELS_PRIMARY }}
          YOUTUBE_CHANNELS_FALLBACK: ${{ vars.YOUTUBE_CHANNELS_FALLBACK }}
          PYTHONIOENCODING: utf-8
        run: |
          cd automation
          python post_once.py --slot ${{ steps.slot.outputs.slot }}

      - name: Save post log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add automation/logs/posts_log.json
          git add automation/data/diversity_override.json 2>/dev/null || true
          git add automation/data/persona_store.json 2>/dev/null || true
          git add automation/data/youtube_cache.json 2>/dev/null || true
          git diff --staged --quiet || git commit -m "log: ${{ steps.slot.outputs.slot }} $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-post-failure --color FF0000 --description "쓰레드 자동 발행 실패 알림" 2>/dev/null || true
          BODY="발행 실패: slot=${{ steps.slot.outputs.slot }} / 시각(KST)=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') / [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          OPEN_ISSUE=$(gh issue list --label auto-post-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "$BODY"
          else
            gh issue create --title "🚨 쓰레드 자동 발행 실패" --label auto-post-failure --body "$BODY"
          fi

      - name: Close recovered issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_ISSUE=$(gh issue list --label auto-post-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "✅ 정상 복구됨: slot=${{ steps.slot.outputs.slot }} / 시각(KST)=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            gh issue close "$OPEN_ISSUE"
          fi

