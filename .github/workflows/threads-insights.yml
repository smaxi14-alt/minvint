name: Threads Insights Fetch

on:
  schedule:
    - cron: '0 17 * * *'  # 매일 KST 02:00 (UTC 17:00)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write    # 실패 알림용

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Fetch Threads insights
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          cd automation
          python fetch_insights.py

      - name: Save insights log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add automation/logs/posts_log.json
          git diff --staged --quiet || git commit -m "insights: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push

      - name: Notify on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create auto-insights-failure --color FF0000 --description "쓰레드 인사이트 수집 실패 알림" 2>/dev/null || true
          BODY="인사이트 수집 실패: 시각(KST)=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') / [실행 로그](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
          OPEN_ISSUE=$(gh issue list --label auto-insights-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "$BODY"
          else
            gh issue create --title "🚨 쓰레드 인사이트 수집 실패" --label auto-insights-failure --body "$BODY"
          fi

      - name: Close recovered issue
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          OPEN_ISSUE=$(gh issue list --label auto-insights-failure --state open --json number --jq '.[0].number // empty')
          if [ -n "$OPEN_ISSUE" ]; then
            gh issue comment "$OPEN_ISSUE" --body "✅ 정상 복구됨: 시각(KST)=$(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M')"
            gh issue close "$OPEN_ISSUE"
          fi
