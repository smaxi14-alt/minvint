name: Threads Insights Fetch

on:
  schedule:
    - cron: '0 17 * * *'  # 매일 KST 02:00 (UTC 17:00)
  workflow_dispatch:       # 수동 실행 가능

jobs:
  fetch:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: automation/requirements.txt

      - name: Install dependencies
        run: pip install -r automation/requirements.txt

      - name: Fetch Threads insights
        env:
          THREADS_ACCESS_TOKEN: ${{ secrets.THREADS_ACCESS_TOKEN }}
          PYTHONIOENCODING: utf-8
        run: |
          cd automation
          python fetch_insights.py

      - name: Save insights log
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add automation/logs/posts_log.json
          git diff --staged --quiet || git commit -m "insights: $(TZ=Asia/Seoul date +%Y-%m-%d)"
          git push
